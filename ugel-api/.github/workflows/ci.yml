name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16.x, 18.x]

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: ugel-api/package-lock.json

      - name: Install dependencies
        run: |
          cd ugel-api
          npm ci

      - name: Run tests
        run: |
          cd ugel-api
          npm test

      - name: Run linting
        run: |
          cd ugel-api
          npm run lint
