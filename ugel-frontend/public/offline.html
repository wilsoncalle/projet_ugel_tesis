<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sin conexión - Sistema de Control de Acceso UGEL</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: #f3f4f6;
        color: #1f2937;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        padding: 0 1rem;
      }
      .container {
        max-width: 28rem;
        text-align: center;
        background-color: white;
        border-radius: 0.5rem;
        padding: 2rem;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 1rem;
        color: #0369a1;
      }
      p {
        margin-bottom: 1.5rem;
        line-height: 1.5;
      }
      .icon {
        font-size: 3rem;
        margin-bottom: 1.5rem;
        color: #0369a1;
      }
      .button {
        display: inline-block;
        background-color: #0369a1;
        color: white;
        font-weight: 500;
        padding: 0.5rem 1rem;
        border-radius: 0.375rem;
        text-decoration: none;
        transition: background-color 0.15s ease-in-out;
      }
      .button:hover {
        background-color: #075985;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">📶</div>
      <h1>Sin conexión a Internet</h1>
      <p>
        No se puede acceder al Sistema de Control de Acceso UGEL en este momento
        porque no hay conexión a Internet.
      </p>
      <p>
        Algunas funciones pueden seguir disponibles en modo sin conexión.
      </p>
      <a href="/" class="button">Intentar nuevamente</a>
    </div>
  </body>
</html>
